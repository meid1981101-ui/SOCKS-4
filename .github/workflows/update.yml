name: Update SOCKS4 Proxy List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update proxies
        run: |
          curl -s "https://raw.githubusercontent.com/VPSLabCloud/VPSLab-Free-Proxy-List/refs/heads/main/socks4_all.txt" > all.txt
          curl -s "https://www.flashproxy.com/api/proxies/txt?protocol=socks4&limit=2000" >> all.txt
          curl -s "https://api.proxyscrape.com/v3/free-proxy-list/get?request=displayproxies&protocol=socks4&proxy_format=ipport&format=text&timeout=2000" >> all.txt
          curl -s "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks4.txt" >> all.txt
          curl -s "https://github.com/proxygenerator1/ProxyGenerator/raw/refs/heads/main/Stable/socks4.txt" >> all.txt
          sort -u all.txt -o all.txt

      - name: Commit and push updated file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add all.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SOCKS4 proxy list" && git push)
